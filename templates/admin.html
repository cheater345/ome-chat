<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>

body{
background:#0a0a0a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1c1c1c;
padding:15px;
margin:10px;
border-radius:10px;
border-left:5px solid orange;
}

.approved{border-left:5px solid green;}
.rejected{border-left:5px solid red;}

button{
padding:8px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
}

.approve{background:green;color:white;}
.reject{background:red;color:white;}

</style>
</head>

<body>

<h1>Payment Requests</h1>

{% for p in payments %}

<div class="card {{p['status']}}">

<h3>{{p['user_email']}}</h3>
<p>GCash Ref: {{p['reference']}}</p>
<p>Status: {{p['status']}}</p>

{% if p['status'] == 'pending' %}

<a href="/admin/approve/{{p['id']}}">
<button class="approve">Approve</button>
</a>

<a href="/admin/reject/{{p['id']}}">
<button class="reject">Reject</button>
</a>

{% endif %}

</div>

{% endfor %}

</body>
</html>
