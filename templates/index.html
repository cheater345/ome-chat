<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Chat</title>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<style>
body{
margin:0;
background:black;
font-family:Arial;
overflow:hidden;
color:white;
}

video{
width:100%;
height:45vh;
object-fit:cover;
background:black;
}

#topbar{
position:fixed;
top:0;
width:100%;
padding:5px;
background:rgba(0,0,0,.5);
backdrop-filter:blur(10px);
z-index:10;
}

select{
width:100%;
padding:10px;
border:none;
border-radius:10px;
background:#111;
color:white;
}

#status{
position:fixed;
top:55px;
width:100%;
text-align:center;
font-size:13px;
z-index:10;
}

#chat{
position:fixed;
bottom:70px;
width:100%;
height:30vh;
display:flex;
flex-direction:column;
}

#msgs{
flex:1;
overflow-y:auto;
padding:10px;
}

.msg{
background:rgba(0,0,0,.35);
padding:7px 12px;
border-radius:10px;
margin:5px;
display:inline-block;
}

#input{
display:flex;
}

#input input{
flex:1;
padding:10px;
border:none;
outline:none;
background:rgba(255,255,255,.1);
color:white;
}

#input button{
padding:10px;
border:none;
background:#00bcd4;
color:white;
}

.controls{
position:fixed;
bottom:0;
width:100%;
display:flex;
gap:5px;
padding:7px;
background:rgba(0,0,0,.6);
}

button{
flex:1;
padding:10px;
border:none;
border-radius:10px;
font-weight:bold;
color:white;
}

.next{background:#00bcd4;}
.stop{background:#f44336;}
.gcash{background:gold;color:black;}
</style>
</head>

<body>

<div id="topbar">
<select id="filter">
<option value="all">All</option>
<option value="boy">Boy (Premium)</option>
<option value="girl">Girl (Premium)</option>
</select>
</div>

<div id="status">Connecting...</div>

<video id="remote" autoplay playsinline></video>
<video id="local" autoplay muted playsinline></video>

<div id="chat">
<div id="msgs"></div>
<div id="input">
<input id="msg" placeholder="Message...">
<button onclick="sendMsg()">Send</button>
</div>
</div>

<div class="controls">
<button class="next" onclick="nextUser()">Next</button>
<button class="stop" onclick="stopUser()">Stop</button>
<button class="gcash">GCash</button>
</div>

<script>
const socket = io();

let stream;
let pc;
let joined = false;

/* CAMERA */
async function startCamera(){
stream = await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
});
document.getElementById("local").srcObject = stream;
}
startCamera();

/* CONNECT SAFE JOIN */
socket.on("connect", () => {
document.getElementById("status").innerText = "Connected";
if(!joined){
socket.emit("join");
joined = true;
}
});

/* MATCHED */
socket.on("matched", async(data)=>{
document.getElementById("status").innerText="Connected";

pc = new RTCPeerConnection({
iceServers:[{urls:"stun:stun.l.google.com:19302"}]
});

stream.getTracks().forEach(track=>{
pc.addTrack(track, stream);
});

pc.ontrack = (e)=>{
document.getElementById("remote").srcObject = e.streams[0];
};

pc.onicecandidate = (e)=>{
if(e.candidate){
socket.emit("signal",{ice:e.candidate});
}
};

if(data.role=="caller"){
const offer = await pc.createOffer();
await pc.setLocalDescription(offer);
socket.emit("signal",{sdp:pc.localDescription});
}
});

/* SIGNAL */
socket.on("signal", async(data)=>{
if(!pc) return;

if(data.sdp){
await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));

if(data.sdp.type=="offer"){
const answer = await pc.createAnswer();
await pc.setLocalDescription(answer);
socket.emit("signal",{sdp:pc.localDescription});
}
}

if(data.ice){
try{
await pc.addIceCandidate(data.ice);
}catch(e){}
}
});

/* CHAT */
socket.on("msg",(msg)=>{
addMsg("Stranger",msg);
});

function sendMsg(){
let msg=document.getElementById("msg").value;
if(msg=="") return;

socket.emit("msg",msg);
addMsg("You",msg);
document.getElementById("msg").value="";
}

function addMsg(u,m){
let div=document.createElement("div");
div.className="msg";
div.innerHTML="<b>"+u+":</b> "+m;
document.getElementById("msgs").appendChild(div);
}

/* NEXT */
function nextUser(){

if(pc){
pc.close();
pc=null;
}

document.getElementById("remote").srcObject=null;
document.getElementById("msgs").innerHTML="";
document.getElementById("status").innerText="Searching...";

socket.emit("next");

/* ❌ NO MORE socket.emit("join") HERE */
}

/* STOP */
function stopUser(){

if(pc){
pc.close();
pc=null;
}

document.getElementById("remote").srcObject=null;
document.getElementById("msgs").innerHTML="";
document.getElementById("status").innerText="Stopped";

socket.emit("next");
}
</script>

</body>
</html>
