<!DOCTYPE html>
<html>
<head>
<title>Login</title>
</head>
<body style="background:#111;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;">

<form method="POST" style="background:#1d1d1d;padding:30px;border-radius:20px;width:300px;">

<h2>Login</h2>

<input name="email" placeholder="Email" style="width:100%;padding:12px;margin-top:10px;background:#333;border:none;color:white;border-radius:10px;">

<input type="password" name="password" placeholder="Password" style="width:100%;padding:12px;margin-top:10px;background:#333;border:none;color:white;border-radius:10px;">

<button style="width:100%;padding:12px;margin-top:15px;background:#0066ff;border:none;color:white;border-radius:10px;">
Login
</button>

</form>

</body>
</html>
